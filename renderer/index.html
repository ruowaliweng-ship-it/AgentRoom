<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>AgentRoom</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 左侧栏：Linear / Raycast 质感导航 + 底部工具停靠栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="brand-header drag-region">
        <img src="../assets/icon.png" alt="AgentRoom" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-name" data-i18n="appTitle">AgentRoom</div>
          <div class="brand-sub" data-i18n="appSubtitle">本地多 AI 协作工作台</div>
        </div>
      </div>

      <div class="sidebar-tools">
        <div class="search-box">
          <svg class="icon-16 search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input id="searchInput" type="text" class="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="搜索群聊或 AI 员工..." />
        </div>
        <div class="sidebar-actions">
          <button id="btnNewGroup" type="button" class="btn-ghost-card">
            <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <path d="M12 7v6"></path>
              <path d="M9 10h6"></path>
            </svg>
            <span data-i18n="newGroup">新建群聊</span>
          </button>
          <button id="btnNewAgent" type="button" class="btn-ghost-card">
            <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
            <span data-i18n="newAgent">新增角色</span>
          </button>
        </div>
      </div>

      <div class="sidebar-scroll">
        <div class="nav-section-title" data-i18n="sectionGroups">项目群聊</div>
        <div id="groupList" class="nav-list"></div>

        <div class="nav-section-title" data-i18n="sectionAgents">AI 员工私聊</div>
        <div id="dmList" class="nav-list"></div>
      </div>

      <!-- 侧栏底部精致工具停靠栏：模型设置 / 深浅色 / 中英双语 -->
      <div class="sidebar-footer">
        <button id="btnProviders" type="button" class="dock-btn dock-btn-grow" title="模型与引擎设置">
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="2" y1="14" x2="6" y2="14"></line>
            <line x1="10" y1="8" x2="14" y2="8"></line>
            <line x1="18" y1="16" x2="22" y2="16"></line>
          </svg>
          <span data-i18n="btnSettings">模型设置</span>
        </button>

        <button id="btnThemeToggle" type="button" class="dock-btn" title="切换深浅色主题">
          <svg id="themeIconSun" class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path><path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path><path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg id="themeIconMoon" class="icon-16 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <button id="btnLangToggle" type="button" class="dock-btn" title="切换语言 / Switch Language">
          <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="langToggleLabel">EN</span>
        </button>
      </div>
    </aside>

    <!-- 侧边栏自由拖拽调宽手柄 -->
    <div id="sidebarResizer" class="sidebar-resizer" title="拖拽调整侧边栏宽度"></div>

    <!-- 右侧主区：环境极光 + 毛玻璃顶栏 + 黄金列宽消息流 + 一体式悬浮圆角输入卡 -->
    <main class="main-area">
      <div class="ambient-aurora" aria-hidden="true"></div>
      <header class="topbar drag-region">
        <div class="topbar-left">
          <h1 id="currentRoomTitle" class="room-title">核心项目协作群</h1>
          <div id="roomAvatarsStack" class="avatar-stack"></div>
          <span id="roomMembersMeta" class="room-members-meta"></span>
        </div>

        <div class="topbar-right no-drag">
          <!-- 全局命令面板快捷入口 (Ctrl+K) -->
          <button id="btnCommandPalette" type="button" class="status-pill cmd-pill" title="全局命令面板 (Ctrl+K)">
            <svg class="icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <kbd class="kbd-chip">Ctrl K</kbd>
          </button>

          <!-- 导出 Markdown 决策纪要 -->
          <button id="btnExportMarkdown" type="button" class="status-pill sandbox-pill" title="导出 Markdown 协作决策纪要">
            <svg class="icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-i18n="btnExportMd">导出纪要</span>
          </button>

          <!-- 授权目录状态胶囊 -->
          <button id="btnSandboxCapsule" type="button" class="status-pill sandbox-pill" title="文件夹安全沙箱">
            <svg class="icon-15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
            </svg>
            <span class="pill-dot"></span>
            <span id="sandboxCapsuleText">未授权目录</span>
          </button>

          <!-- 极简轮次 / 熔断指示器 -->
          <div id="orchestratorIndicator" class="status-pill indicator-pill">
            <span id="indicatorStatusDot" class="pill-dot"></span>
            <span id="indicatorStatusText">就绪</span>
            <span class="pill-sep">·</span>
            <span id="indicatorRoundText">轮次 0/3</span>
            <span class="pill-sep">·</span>
            <span id="indicatorRejectText">打回 0/2</span>
          </div>

          <!-- 无边框窗口控制三键 -->
          <div class="window-controls">
            <button id="btnWinMin" type="button" class="win-btn" title="最小化">
              <svg class="icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <button id="btnWinMax" type="button" class="win-btn" title="最大化">
              <svg class="icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="5" width="14" height="14" rx="2"></rect>
              </svg>
            </button>
            <button id="btnWinClose" type="button" class="win-btn win-btn-close" title="关闭">
              <svg class="icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- 消息流容器 -->
      <section id="messageList" class="message-list">
        <div id="messageStreamInner" class="message-stream-inner"></div>
      </section>

      <!-- 一体式悬浮圆角 Composer 输入卡片 -->
      <footer class="composer-wrap">
        <div class="composer-card">
          <div id="attachedFilesBar" class="attached-files-bar hidden"></div>

          <textarea id="chatInput" class="chat-input" rows="2" placeholder="输入任务或 @角色（Enter 发送，Shift+Enter 换行）..."></textarea>

          <div class="composer-bottom-bar">
            <div class="composer-actions-left">
              <div class="mention-wrapper">
                <button id="btnMentionMenu" type="button" class="composer-tool-btn" title="@ 角色">
                  <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path>
                  </svg>
                  <span data-i18n="btnMention">@ 角色</span>
                </button>
                <div id="mentionPopup" class="mention-popup hidden"></div>
              </div>

              <button id="btnAttachFromSandbox" type="button" class="composer-tool-btn" title="引用沙箱文件">
                <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
                <span data-i18n="btnAttachFile">引用文件</span>
              </button>

              <label class="rounds-control" title="单次自动流转最大轮次">
                <svg class="icon-15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                  <path d="M16 16h5v5"></path>
                </svg>
                <select id="maxRoundsSelect" class="rounds-select">
                  <option value="1">1 轮</option>
                  <option value="2">2 轮</option>
                  <option value="3" selected>3 轮</option>
                  <option value="4">4 轮</option>
                  <option value="5">5 轮</option>
                  <option value="6">6 轮</option>
                  <option value="8">8 轮</option>
                  <option value="10">10 轮</option>
                </select>
              </label>

              <button id="btnClearChat" type="button" class="composer-tool-btn icon-only" title="清空当前会话消息">
                <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"></path>
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                </svg>
              </button>
            </div>

            <div class="composer-actions-right">
              <button id="btnSend" type="button" class="send-circle-btn" title="发送 (Enter)">
                <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5"></path>
                  <path d="m5 12 7-7 7 7"></path>
                </svg>
              </button>
              <button id="btnAbort" type="button" class="abort-circle-btn hidden" title="中止流转">
                <svg class="icon-14" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- 安全沙箱文件树抽屉 -->
  <div id="sandboxDrawerBackdrop" class="drawer-backdrop"></div>
  <aside id="sandboxDrawer" class="drawer">
    <div class="drawer-header">
      <div>
        <h2 data-i18n="drawerSandboxTitle">文件夹安全沙箱</h2>
        <p class="muted-text" data-i18n="drawerSandboxDesc">仅允许访问通过系统对话框授权的目录，自动拦截 ../ 越界与逃逸符号链接。</p>
      </div>
      <button id="btnCloseSandbox" type="button" class="btn-close">&times;</button>
    </div>

    <div class="drawer-actions">
      <button id="btnAddGrant" type="button" class="btn-primary btn-sm" data-i18n="btnAddGrant">授权项目文件夹</button>
      <button id="btnRefreshTree" type="button" class="btn-subtle btn-sm" data-i18n="btnRefreshTree">刷新</button>
    </div>

    <div id="grantListContainer" class="grant-list"></div>
    <div id="fileTreeContainer" class="file-tree"></div>

    <div id="filePreviewBox" class="file-preview hidden">
      <div class="file-preview-header">
        <span id="previewFileName" class="preview-file-name"></span>
        <div class="preview-file-actions">
          <button id="btnAttachPreviewFile" type="button" class="btn-subtle btn-xs" data-i18n="btnAttachToInput">引用到输入框</button>
          <button id="btnSavePreviewFile" type="button" class="btn-primary btn-xs" data-i18n="btnSaveFile">保存修改</button>
        </div>
      </div>
      <textarea id="previewFileContent" class="preview-textarea" spellcheck="false"></textarea>
    </div>
  </aside>

  <!-- 模态弹窗：卡片式模型与 CLI 设置 -->
  <div id="providersModal" class="modal-backdrop">
    <div class="modal modal-lg">
      <div class="modal-header">
        <div>
          <h2 data-i18n="modalProvidersTitle">模型与引擎设置（卡片式）</h2>
          <p class="muted-text" data-i18n="modalProvidersDesc">API Key 仅保存在本机用户数据目录，界面脱敏展示，绝不写入项目仓库。</p>
        </div>
        <div class="modal-header-actions">
          <button id="btnScanLocalAI" type="button" class="btn-subtle btn-sm btn-with-icon">
            <svg class="icon-15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10"></path>
              <path d="M12 12 19 5"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 6a6 6 0 1 0 6 6"></path>
            </svg>
            <span data-i18n="providerScanBtn">自动扫描本机 AI</span>
          </button>
          <select id="newProviderTypeSelect" class="inline-select">
            <option value="agy" data-i18n="providerTypeAgy">本机 agy 模型（零费用）</option>
            <option value="openai" data-i18n="providerTypeOpenai">OpenAI 兼容 API</option>
            <option value="cli" data-i18n="providerTypeCli">本地 CLI 命令行</option>
          </select>
          <button id="btnAddProviderCard" type="button" class="btn-primary btn-sm" data-i18n="providerAddBtn">+ 新增引擎卡片</button>
          <button id="btnCloseProviders" type="button" class="btn-close">&times;</button>
        </div>
      </div>
      <div id="discoveryBanner" class="discovery-banner hidden">
        <div class="discovery-banner-top">
          <span id="discoverySummaryText" class="discovery-summary-text"></span>
          <button id="btnAutoConnectAll" type="button" class="btn-primary btn-xs" data-i18n="providerAutoConnectAll">一键自动连接全部</button>
        </div>
        <div id="discoveryList" class="discovery-list"></div>
      </div>
      <div id="providersGrid" class="providers-grid"></div>
    </div>
  </div>

  <!-- 模态弹窗：新增 / 编辑 AI 角色 -->
  <div id="agentModal" class="modal-backdrop">
    <div class="modal modal-md">
      <div class="modal-header">
        <h2 id="agentModalTitle">新增 AI 协作者</h2>
        <button id="btnCloseAgentModal" type="button" class="btn-close">&times;</button>
      </div>
      <form id="agentForm" class="modal-form">
        <input type="hidden" id="agentIdInput" />
        <div class="form-row">
          <div class="form-group">
            <label for="agentNameInput" data-i18n="agentName">角色名称</label>
            <input id="agentNameInput" type="text" required maxlength="24" />
          </div>
          <div class="form-group">
            <label for="agentTitleInput" data-i18n="agentTitle">角色头衔</label>
            <input id="agentTitleInput" type="text" maxlength="32" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="agentColorInput" data-i18n="agentColor">主题徽章色</label>
            <input id="agentColorInput" type="color" value="#38BDF8" />
          </div>
          <div class="form-group">
            <label for="agentProviderSelect" data-i18n="agentProvider">专属模型引擎（可选）</label>
            <select id="agentProviderSelect"></select>
          </div>
        </div>
        <div class="form-group">
          <label for="agentPromptInput" data-i18n="agentPrompt">系统提示词（System Prompt）</label>
          <textarea id="agentPromptInput" rows="5"></textarea>
        </div>
        <div class="modal-footer">
          <button id="btnDeleteAgent" type="button" class="btn-danger hidden" data-i18n="agentDelete">删除角色</button>
          <div class="modal-footer-right">
            <button id="btnCancelAgent" type="button" class="btn-subtle" data-i18n="agentCancel">取消</button>
            <button type="submit" class="btn-primary" data-i18n="agentSave">保存角色</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 模态弹窗：新建项目群聊（含 4 套场景协作模板） -->
  <div id="groupModal" class="modal-backdrop">
    <div class="modal modal-lg">
      <div class="modal-header">
        <div>
          <h2 data-i18n="modalGroupTitle">新建项目协作群</h2>
          <p class="muted-text" data-i18n="templateSectionTitle">一键选择场景协作模板（自动配备专属角色）</p>
        </div>
        <button id="btnCloseGroupModal" type="button" class="btn-close">&times;</button>
      </div>
      <div id="roomTemplatesGrid" class="template-grid"></div>
      <form id="groupForm" class="modal-form">
        <div class="template-divider" data-i18n="templateCustomTitle">或自定义群聊名称与成员</div>
        <div class="form-group">
          <label for="groupNameInput" data-i18n="groupName">群聊名称</label>
          <input id="groupNameInput" type="text" required maxlength="40" data-i18n-placeholder="groupNamePlaceholder" placeholder="例如：登录模块重构群" />
        </div>
        <div class="form-group">
          <label data-i18n="groupMembers">选择群内 AI 协作者</label>
          <div id="groupMembersCheckboxes" class="checkbox-grid"></div>
        </div>
        <div class="modal-footer">
          <div></div>
          <div class="modal-footer-right">
            <button id="btnCancelGroup" type="button" class="btn-subtle" data-i18n="agentCancel">取消</button>
            <button type="submit" class="btn-primary" data-i18n="groupCreate">创建群聊</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 全局命令面板 (Ctrl+K, Raycast 毛玻璃风格) -->
  <div id="commandPaletteModal" class="modal-backdrop cmd-backdrop">
    <div class="cmd-palette">
      <div class="cmd-input-row">
        <svg class="icon-16 cmd-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="commandPaletteInput" type="text" class="cmd-input" data-i18n-placeholder="cmdPlaceholder" placeholder="输入命令、群聊或 AI 角色名称..." autocomplete="off" />
        <kbd class="kbd-chip">ESC</kbd>
      </div>
      <div id="commandPaletteList" class="cmd-list"></div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script defer src="./i18n.js"></script>
  <script defer src="./markdown.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
